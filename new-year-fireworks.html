<!DOCTYPE html>
<html lang="en">
<head>
		<base href="/radiant-kr/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Year Fireworks</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  .label {
    position: fixed; top: 20px; left: 24px;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    color: rgba(200, 149, 108, 0.5); z-index: 10; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div class="label">New Year Fireworks</div>
<canvas id="canvas"></canvas>
<script>
(function() {
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var width, height, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener('resize', resize);

  // Tunable parameters
  var BURST_RATE = 1.0;        // 폭죽 발사 빈도 (0.3 ~ 3.0)
  var PARTICLE_COUNT = 1.0;    // 폭죽당 파티클 수 배율 (0.5 ~ 2.0)

  // Firework color palette — 한국 전통 5색 (오방색) + 현대 금빛
  // 青(청록) 赤(적) 黃(황) 白(백) 黒(흑) + 金(금) 파스텔/네온 변형
  var PALETTES = [
    // Traditional obangsaek
    [
      { r: 0x2E, g: 0x86, b: 0xC1 },   // 청 (blue-green)
      { r: 0xE0, g: 0x39, b: 0x46 },   // 적 (red)
      { r: 0xF1, g: 0xC4, b: 0x0F },   // 황 (yellow)
      { r: 0xF5, g: 0xF5, b: 0xF5 },   // 백 (white)
      { r: 0x2C, g: 0x3E, b: 0x50 }    // 흑 (deep navy)
    ],
    // Royal gold
    [
      { r: 0xFF, g: 0xD7, b: 0x00 },
      { r: 0xFF, g: 0xAA, b: 0x33 },
      { r: 0xC9, g: 0x52, b: 0x33 },
      { r: 0xFF, g: 0xE8, b: 0x8A },
      { r: 0x8B, g: 0x00, b: 0x00 }
    ],
    // Spring blossom
    [
      { r: 0xFF, g: 0xB7, b: 0xC5 },
      { r: 0xFF, g: 0x69, b: 0xB4 },
      { r: 0xFF, g: 0xE8, b: 0x8A },
      { r: 0xB5, g: 0xE8, b: 0xFC },
      { r: 0xFF, g: 0xD9, b: 0xB3 }
    ]
  ];

  // Particle system
  var particles = [];
  var trails = [];
  var rockets = [];  // 상승 중인 폭죽 로켓
  var MAX_PARTICLES = 800;

  // Stars in background (twinkling)
  var stars = [];
  for (var i = 0; i < 80; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random() * 0.7,  // upper 70%
      r: 0.3 + Math.random() * 1.2,
      twinkleSpeed: 0.5 + Math.random() * 2,
      twinklePhase: Math.random() * Math.PI * 2
    });
  }

  function randomPalette() {
    return PALETTES[Math.floor(Math.random() * PALETTES.length)];
  }

  function randomColor(palette) {
    var c = palette[Math.floor(Math.random() * palette.length)];
    return { r: c.r, g: c.g, b: c.b };
  }

  function spawnRocket(x, targetY, palette) {
    rockets.push({
      x: x,
      y: height,
      targetY: targetY,
      vx: (Math.random() - 0.5) * 30,
      vy: -(600 + Math.random() * 200),
      color: randomColor(palette),
      palette: palette,
      trail: []
    });
  }

  function explode(x, y, palette) {
    var count = Math.round(60 * PARTICLE_COUNT);
    var baseHue = palette[Math.floor(Math.random() * palette.length)];

    for (var i = 0; i < count; i++) {
      var angle = (i / count) * Math.PI * 2 + Math.random() * 0.3;
      var speed = 80 + Math.random() * 180;
      var c = Math.random() < 0.7 ? baseHue : randomColor(palette);

      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1.0,
        decay: 0.3 + Math.random() * 0.5,
        r: c.r,
        g: c.g,
        b: c.b,
        size: 1.5 + Math.random() * 1.5,
        type: Math.random() < 0.3 ? 'sparkle' : 'normal'
      });
    }

    // 가끔 이중 폭발 (chrysanthemum effect)
    if (Math.random() < 0.3) {
      var delay = 0.2 + Math.random() * 0.3;
      setTimeout(function() {
        for (var j = 0; j < 30; j++) {
          var a = Math.random() * Math.PI * 2;
          var s = 50 + Math.random() * 80;
          particles.push({
            x: x + (Math.random() - 0.5) * 20,
            y: y + (Math.random() - 0.5) * 20,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            life: 0.6,
            decay: 1.0,
            r: 255, g: 220, b: 100,
            size: 1.0,
            type: 'sparkle'
          });
        }
      }, delay * 1000);
    }
  }

  function updateRockets(dt) {
    for (var i = rockets.length - 1; i >= 0; i--) {
      var r = rockets[i];
      r.x += r.vx * dt;
      r.y += r.vy * dt;
      r.vy += 200 * dt;  // gravity (slows ascent)

      // Trail
      r.trail.push({ x: r.x, y: r.y, life: 0.6 });
      if (r.trail.length > 12) r.trail.shift();

      // Explode at apex
      if (r.vy >= -50 || r.y <= r.targetY) {
        explode(r.x, r.y, r.palette);
        rockets.splice(i, 1);
      }
    }
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 180 * dt;  // gravity
      p.vx *= 0.99;       // air drag
      p.life -= p.decay * dt;

      if (p.life <= 0 || p.y > height + 20) {
        particles.splice(i, 1);
      }
    }

    // Cap particle count
    while (particles.length > MAX_PARTICLES) {
      particles.shift();
    }
  }

  function drawStars(time) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var brightness = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time * s.twinkleSpeed + s.twinklePhase));
      ctx.fillStyle = 'rgba(200, 180, 150, ' + (brightness * 0.6) + ')';
      ctx.beginPath();
      ctx.arc(s.x * width, s.y * height, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawRockets() {
    for (var i = 0; i < rockets.length; i++) {
      var r = rockets[i];

      // Trail
      for (var j = 0; j < r.trail.length; j++) {
        var t = r.trail[j];
        var alpha = (j / r.trail.length) * 0.6 * t.life;
        ctx.fillStyle = 'rgba(' + r.color.r + ',' + r.color.g + ',' + r.color.b + ',' + alpha + ')';
        ctx.beginPath();
        ctx.arc(t.x, t.y, 1.5, 0, Math.PI * 2);
        ctx.fill();
        t.life -= 0.05;
      }

      // Rocket head
      ctx.fillStyle = 'rgb(' + r.color.r + ',' + r.color.g + ',' + r.color.b + ')';
      ctx.shadowColor = 'rgb(' + r.color.r + ',' + r.color.g + ',' + r.color.b + ')';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var alpha = Math.max(0, p.life);
      var size = p.size * (0.5 + 0.5 * alpha);

      if (p.type === 'sparkle') {
        // 십자 모양 sparkle
        ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + alpha + ')';
        ctx.fillRect(p.x - size, p.y - 0.5, size * 2, 1);
        ctx.fillRect(p.x - 0.5, p.y - size, 1, size * 2);
      } else {
        ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + alpha + ')';
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();

        // Add subtle glow on bright particles
        if (p.size > 2 && alpha > 0.5) {
          ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + (alpha * 0.3) + ')';
          ctx.beginPath();
          ctx.arc(p.x, p.y, size * 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  function drawVignette() {
    var cx = width / 2;
    var cy = height / 2;
    var maxDim = Math.max(width, height);
    var vignette = ctx.createRadialGradient(cx, cy, maxDim * 0.2, cx, cy, maxDim * 0.9);
    vignette.addColorStop(0, 'rgba(10, 10, 10, 0)');
    vignette.addColorStop(1, 'rgba(10, 10, 10, 0.55)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, width, height);
  }

  // Auto-spawn fireworks
  var autoSpawnTimer = 0;

  function autoSpawn(dt) {
    autoSpawnTimer -= dt;
    if (autoSpawnTimer <= 0) {
      autoSpawnTimer = (0.8 + Math.random() * 1.5) / BURST_RATE;
      var x = width * 0.15 + Math.random() * width * 0.7;
      var y = height * 0.15 + Math.random() * height * 0.35;
      spawnRocket(x, y, randomPalette());
    }
  }

  // Mouse click — fire a rocket at click position
  function fireAt(x, y) {
    spawnRocket(x, height, randomPalette());
  }

  canvas.addEventListener('click', function(e) {
    fireAt(e.clientX, e.clientY);
  });

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    fireAt(t.clientX, t.clientY);
  }, { passive: false });

  canvas.addEventListener('mousemove', function(e) {
    // Subtle hint: occasionally spawn small firework near cursor when idle
    // (very low frequency, doesn't dominate)
  });

  // Animation loop
  var lastTime = 0;
  var lastSpawn = 0;

  resize();

  function render(timestamp) {
    if (!lastTime) lastTime = timestamp;
    var dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    var time = timestamp / 1000;

    if (prefersReduced) {
      dt = Math.min(dt, 0.016);
    }

    // Dark navy gradient background (한국 전통 남색 계열)
    var bgGrad = ctx.createLinearGradient(0, 0, 0, height);
    bgGrad.addColorStop(0, '#0a0a14');
    bgGrad.addColorStop(0.5, '#0d0f1a');
    bgGrad.addColorStop(1, '#0a0a0a');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, width, height);

    // Auto-spawn (skip if user actively clicking)
    if (!prefersReduced) {
      autoSpawn(dt);
    }

    updateRockets(dt);
    updateParticles(dt);

    drawStars(time);
    drawRockets();
    drawParticles();
    drawVignette();

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);

  // Pause when offscreen
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      // Reduce spawn rate but keep loop running (for graceful resume)
      BURST_RATE = 0.3;
    } else {
      BURST_RATE = 1.0;
    }
  });

  // PostMessage listener for parameter updates
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'param') {
      switch (e.data.name) {
        case 'BURST_RATE': BURST_RATE = e.data.value; break;
        case 'PARTICLE_COUNT': PARTICLE_COUNT = e.data.value; break;
      }
    }
  });
})();
</script>
</body>
</html>
